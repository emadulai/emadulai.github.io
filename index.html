<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>আমার ওয়েবসাইট | স্বাগতম</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }
    body {
      background: #0f172a;
      color: #f8fafc;
      display: flex;
      flex-direction: column;
      min-height: 100vh;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 20px;
    }
    .card {
      background: #1e293b;
      border: 1px solid #334155;
      padding: 40px 30px;
      border-radius: 16px;
      max-width: 500px;
      width: 100%;
      box-shadow: 0 10px 25px rgba(0,0,0,0.4);
    }
    .badge {
      display: inline-block;
      padding: 6px 14px;
      background: rgba(34, 197, 94, 0.15);
      color: #22c55e;
      border-radius: 20px;
      font-size: 13px;
      font-weight: 600;
      margin-bottom: 20px;
    }
    h1 {
      font-size: 28px;
      margin-bottom: 12px;
      color: #38bdf8;
    }
    p {
      color: #94a3b8;
      font-size: 15px;
      line-height: 1.6;
      margin-bottom: 24px;
    }
    .btn-group {
      display: flex;
      gap: 12px;
      justify-content: center;
      flex-wrap: wrap;
    }
    a.btn {
      text-decoration: none;
      padding: 10px 20px;
      border-radius: 8px;
      font-size: 14px;
      font-weight: 600;
      transition: all 0.2s ease;
    }
    .btn-primary {
      background: #38bdf8;
      color: #0f172a;
    }
    .btn-primary:hover {
      background: #0ea5e9;
    }
    .btn-secondary {
      background: #334155;
      color: #f8fafc;
    }
    .btn-secondary:hover {
      background: #475569;
    }
  </style>
</head>
<body>

  <div class="card">
    <div class="badge">● লাইভ ও রানিং</div>
    <h1>স্বাগতম আমার ওয়েবসাইটে</h1>
    <p>এটি GitHub Pages-এ সম্পূর্ণ ফ্রিতে হোস্ট করা একটি লাইভ ওয়েবসাইট। কোড এডিট করে খুব সহজেই নিজের মতো সাজিয়ে নেওয়া যায়।</p>
    
    <div class="btn-group">
      <a href="https://github.com" target="_blank" class="btn btn-primary">গিটহাব প্রোফাইল</a>
      <a href="mailto:example@gmail.com" class="btn btn-secondary">যোগাযোগ</a>
    </div>
  </div>

</body>
</html>
